
<!DOCTYPE html>
<html>
<head>
  <title>WAF Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-3">
<h2>WAF Activity Dashboard</h2>

<table class="table table-bordered table-striped mt-3">
  <thead>
    <tr>
      <th>Timestamp</th>
      <th>IP</th>
      <th>Path</th>
      <th>Status</th>
      <th>Reason</th>
    </tr>
  </thead>
  <tbody>
    {% for row in logs %}
    <tr>
      <td>{{ row[0] }}</td>
      <td>{{ row[1] }}</td>
      <td>{{ row[2] }}</td>
      <td>{{ row[3] }}</td>
      <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</body>
</html>
